name = "budget"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Adresse publique budget.<ton-compte>.workers.dev (activée à chaque déploiement).
workers_dev = true

# L'interface (dossier public) est servie directement par Cloudflare.
# Les adresses d'invitation (/i/...) et de retour de la banque (/callback)
# passent d'abord par le serveur.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/i/*", "/callback"]

# Base de données D1 : remplace l'id par celui de la base « budget »
# créée dans le tableau de bord Cloudflare (Stockage et bases de données > D1).
[[d1_databases]]
binding = "DB"
database_name = "budget"
database_id = "84f7b480-43de-40c7-8baf-c280dc317716"

[vars]
# Identifiant de ton application Enable Banking de production (pas secret).
# Sandbox (tests) : 21d719a6-32b5-462c-b849-c7ca4bbc4f68
EB_APP_ID = "3070e112-d081-47f0-85fa-b08b26ad27ca"

# Synchronisation automatique 2 fois par jour (heures UTC : 7h et 19h à Paris l'hiver, 8h et 20h l'été).
# Les banques limitent à 4 consultations par jour sans toi : ne pas dépasser 4.
# Le bouton de synchronisation dans l'app ne compte pas dans cette limite.
[triggers]
crons = ["7 6,18 * * *"]

# Secrets à définir dans le tableau de bord (Worker > Paramètres > Variables et secrets),
# jamais dans ce fichier :
#   EB_PRIVATE_KEY      contenu du fichier .pem
#   CODE_INSTALLATION   phrase de passe pour activer ton téléphone
